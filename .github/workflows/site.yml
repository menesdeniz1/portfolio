name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve and check
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3109 > /tmp/portfolio-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3109/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/portfolio-site.log; exit 1; fi
          node scripts/check-site.mjs
